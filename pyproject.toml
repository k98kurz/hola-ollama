[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hola-harness"
version = "0.0.1"
authors = [
  { name="k98kurz", email="k98kurz@gmail.com" },
]
description = "Extensible Ollama Harness for Robust Local Agents"
readme = "readme.md"
requires-python = ">=3.10"
license = "LicenseRef-Pycelium-Reciprocal-License"
license-files = ["license"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "crossconfig == 0.0.8",
  "flying-state-machines == 0.3.1",
  "httpx == 0.27.1",
  "packify == 0.3.4",
  "sqloquent == 0.7.4",
  "vicinus == 0.0.3",
]

[project.urls]
"Homepage" = "https://pycelium.com"
"Repository" = "https://github.com/k98kurz/hola"
"Bug Tracker" = "https://github.com/k98kurz/hola/issues"

[project.scripts]
hola = "hola.cli:main"

[project.optional-dependencies]
docs = [
  "autodox == 0.1.16"
]
numpy = [
  "numpy == 2.4.4"
]

[tool.hatch.build.targets.wheel]
packages = ["hola"]
exclude = [
  ".github",
  "tests",
  "AGENTS.md",
  "notes",
  "references",
  "scripts",
  "temp",
  "tickets",
  "venv",
]

[tool.hatch.build.targets.sdist]
exclude = [
  ".github",
  "tests",
  "AGENTS.md",
  "notes",
  "references",
  "scripts",
  "temp",
  "tickets",
  "venv",
]
